<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>날씨 레이더</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="map"></div>

<div id="layer-panel">
  <button class="layer-btn active" data-layer="precip">강수량</button>
  <button class="layer-btn" data-layer="temp">기온</button>
  <button class="layer-btn" data-layer="air">대기질</button>
  <button class="layer-btn" data-layer="wind">바람</button>
</div>

<div id="status-bar">
  <div class="title" id="status-title">강수량 (레이더)</div>
  <div class="value" id="status-value">기상청 레이더 합성영상</div>
  <div class="note" id="status-note">관측시각 불러오는 중...</div>
</div>

<div id="setup-warning" style="display:none;">
  <div class="box">
    <h1>API 키를 먼저 설정해주세요</h1>
    <p><code>config.js</code> 파일을 열어 카카오맵 JavaScript 키를 넣어야 지도가 뜹니다.</p>
    <p>1. developers.kakao.com 접속 → 로그인<br>
       2. 내 애플리케이션 → 애플리케이션 추가<br>
       3. 앱 키 → JavaScript 키 복사<br>
       4. 플랫폼 설정 → Web 플랫폼 등록 (예: http://localhost:5500, 또는 실제 배포 도메인)</p>
    <code>config.js 안의 KAKAO_JS_KEY 값을 교체하세요</code>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
