<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet 지도 + 기상 레이더 UI</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. 지도가 맨 밑 바닥 전체에 깔림 (z-index: 1) */
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 2. 지도 위에 얹어질 기존 UI 영역 요소들 (z-index: 1000 이상) */
    
    /* 상단 헤더 / 검색바 UI 예시 */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      pointer-events: none; /* 클릭 투과 (내부 버튼만 클릭 가능하게 설정) */
    }

    .search-box {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      font-weight: 600;
      color: #333;
    }

    /* 하단 레이더 컨트롤 패널 UI 예시 */
    .radar-control-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .radar-btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .radar-btn:hover {
      background: #0056b3;
    }

    .radar-time {
      font-size: 14px;
      font-family: monospace;
      min-width: 140px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 기존 UI 요소 (지도 위에 떠있는 형태) -->
  <div class="top-bar">
    <div class="search-box">
      🌧️ 실시간 기상 레이더 대시보드
    </div>
  </div>

  <!-- 레이더 컨트롤러 UI -->
  <div class="radar-control-panel">
    <button id="playBtn" class="radar-btn">▶ 일시정지</button>
    <span id="radarTime" class="radar-time">레이더 로딩 중...</span>
  </div>

  <!-- 전체 화면 Leaflet 지도 컨테이너 -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <script>
    // 1. Leaflet 지도 초기화 (한국 중심 좌표)
    const map = L.map('map', {
      zoomControl: false // 기본 줌 버튼 위치 조정 필요시 끌 수 있음
    }).setView([36.5, 127.8], 7);

    // Zoom 컨트롤 버튼 오른쪽 상단으로 이동
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 2. 기본 베이스 지도 타일 (OpenStreetMap)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 3. RainViewer API를 활용한 실시간 기상 레이더 레이어 연동
    let radarLayers = [];
    let radarTimestamps = [];
    let currentIndex = 0;
    let animationInterval = null;

    // RainViewer API에서 최신 기상 레이더 타임스탬프 데이터 가져오기
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then(res => res.json())
      .then(data => {
        // 과거~현재 실시간 레이더 프레임 목록 (radar.past)
        radarTimestamps = data.radar.past;
        
        // 각 타임스탬프별 Leaflet 타일 레이어 생성 (미리 로드하여 준비)
        radarTimestamps.forEach((item, idx) => {
          const tileUrl = `${data.host}${item.path}/256/{z}/{x}/{y}/2/1_1.png`;
          const layer = L.tileLayer(tileUrl, {
            opacity: 0, // 기본적으로 숨김 처리
            maxZoom: 18,
            zIndex: 100 // 지도 타일보다 위에 올라오도록 설정
          }).addTo(map);

          radarLayers.push(layer);
        });

        // 애니메이션 시작
        if (radarLayers.length > 0) {
          showFrame(radarLayers.length - 1); // 가장 최근 레이더 표시
          startAnimation();
        }
      })
      .catch(err => {
        console.error("레이더 데이터를 불러오지 못했습니다:", err);
        document.getElementById('radarTime').innerText = "레이더 로딩 실패";
      });

    // 특정 프레임의 레이더만 불투명도(opacity)를 높여 보여주는 함수
    function showFrame(index) {
      radarLayers.forEach((layer, i) => {
        if (i === index) {
          layer.setOpacity(0.65); // 레이더 투명도 조절 (0.6 ~ 0.7 적당)
        } else {
          layer.setOpacity(0);
        }
      });

      // 레이더 시간 표시 (UTC -> 한국 시각 변환)
      const timeStr = new Date(radarTimestamps[index].time * 1000).toLocaleTimeString('ko-KR', {
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('radarTime').innerText = `시간: ${timeStr}`;
      currentIndex = index;
    }

    // 재생 애니메이션 함수
    function startAnimation() {
      if (animationInterval) clearInterval(animationInterval);
      animationInterval = setInterval(() => {
        const nextIndex = (currentIndex + 1) % radarLayers.length;
        showFrame(nextIndex);
      }, 700); // 0.7초마다 다음 레이더 프레임 전환
    }

    // 재생/일시정지 버튼 클릭 이벤트
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
        playBtn.innerText = '▶ 재생';
      } else {
        startAnimation();
        playBtn.innerText = '⏸ 일시정지';
      }
    });
  </script>
</body>
</html>
