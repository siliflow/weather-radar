<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Leaflet Test</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
</head>
<body style="margin:0; padding:0;">

  <!-- 지도 영역 (화면 전체 채우기) -->
  <div id="map" style="width: 100vw; height: 100vh;"></div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    // 지도 불러오기
    var map = L.map('map').setView([37.5665, 126.9780], 13);

    // 타일 연결
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // 마커 표시
    L.marker([37.5665, 126.9780]).addTo(map);
  </script>
</body>
</html>

  <h1>Leaflet.js 지도 테스트</h1>
  
  <!-- 지도가 들어갈 컨테이너 -->
  <div id="map"></div>

  <!-- 2. Leaflet JavaScript 불러오기 -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin="">
  </script>

  <script>
    // 3. 지도 생성 및 중심 좌표 설정 ([위도, 경도], Zoom Level)
    // 예시: 서울시청 위치 (37.5665, 126.9780), 줌 14
    const map = L.map('map').setView([37.5665, 126.9780], 14);

    // 4. 지도 타일 레이어 추가 (OpenStreetMap 사용)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 5. 기본 마커 추가 및 팝업 설정
    const marker = L.marker([37.5665, 126.9780]).addTo(map);
    marker.bindPopup("<b>서울시청</b><br>Leaflet 지도가 정상 실행 중입니다.").openPopup();

    // 6. 클릭한 위치에 팝업 띄우기 이벤트 예시
    const popup = L.popup();
    function onMapClick(e) {
      popup
        .setLatLng(e.latlng)
        .setContent("클릭한 좌표:<br>" + e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5))
        .openOn(map);
    }
    map.on('click', onMapClick);
  </script>

</body>
</html>
